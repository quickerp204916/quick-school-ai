name: Deploy

# Deploys main to the production server after CI passes, or by hand from the Actions tab.
# Repository secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST         server IP or hostname
#   DEPLOY_USER         deploy (created by deploy/install.sh)
#   DEPLOY_SSH_KEY      private key whose public half is in /home/deploy/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan -t ed25519 <server>
# Optional repository variable: DEPLOY_PATH (default /opt/quick-school-ai)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy the tested commit
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/quick-school-ai' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$USER_NAME@$HOST" \
            "set -e; cd '$DEPLOY_PATH'; git fetch --quiet origin; git checkout --quiet --detach '$SHA'; ./deploy/deploy.sh --no-pull"
