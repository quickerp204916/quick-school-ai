name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-tests:
    name: Laravel tests on ${{ matrix.db }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql]
    defaults:
      run:
        working-directory: web
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: qsa_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
      DB_DATABASE: qsa_test
      # PostgreSQL: a normal role (not superuser, no BYPASSRLS), so Row-Level Security applies as in production.
      DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'qsa_app' }}
      DB_PASSWORD: ${{ matrix.db == 'mysql' && 'root' || 'qsa_app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_pgsql, intl
          coverage: none

      - name: Create the application database role (PostgreSQL)
        if: matrix.db == 'pgsql'
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE qsa_app LOGIN PASSWORD 'qsa_app' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE qsa_test OWNER qsa_app"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('web/composer.json', 'web/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint PHP
        run: find app modules database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run migrations from scratch (tenant guards, foreign keys)
        run: php artisan migrate:fresh --seed --force

      - name: Run tests
        run: php artisan test

  ai-service-tests:
    name: AI service tests (Python, pgvector)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai-service
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qsa_ai
          POSTGRES_PASSWORD: qsa_ai
          POSTGRES_DB: qsa_ai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U qsa_ai"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      QSA_AI_TEST_DATABASE_URL: postgresql://qsa_ai:qsa_ai@127.0.0.1:5432/qsa_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - name: Enable pgvector
        run: PGPASSWORD=qsa_ai psql -h 127.0.0.1 -U qsa_ai -d qsa_ai_test -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
