name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-tests:
    name: Laravel tests on MySQL 8.4
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: qsa_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('web/composer.json', 'web/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint PHP
        run: find app modules database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run migrations from scratch (checks triggers and foreign keys)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: qsa_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate:fresh --seed --force

      - name: Run tests
        run: php artisan test

      - name: Upload composer.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: web/composer.lock
